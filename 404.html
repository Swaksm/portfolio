<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — swaks.org</title>
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script>
    // Thème mémorisé (bouton soleil/lune), sinon celui du système
    try { const theme = localStorage.getItem('swaks-theme'); if (theme) document.documentElement.dataset.theme = theme; } catch (e) {}
  </script>
  <style>
    @font-face { font-family: 'Outfit'; font-weight: 100 900; font-display: swap; src: url(/fonts/outfit-latin.woff2) format('woff2'); }
    @font-face { font-family: 'Roboto Condensed'; font-weight: 900; font-display: swap; src: url(/fonts/roboto-condensed-900-latin.woff2) format('woff2'); }
    :root { --bg: #F1EEE7; --text: #3a3530; --taupe: #C7C0A8; --mauve: #C88ABB; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #1c1917; --text: #ece6dc; --taupe: #7f7668; --mauve: #D49DC8; }
    }
    :root[data-theme="dark"] { --bg: #1c1917; --text: #ece6dc; --taupe: #7f7668; --mauve: #D49DC8; }
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem;
      background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; padding: 1rem; text-align: center;
    }
    h1 { font-family: 'Roboto Condensed', sans-serif; font-weight: 900; font-size: clamp(64px, 18vw, 180px); letter-spacing: 0.15em; line-height: 1; }
    h1 span { color: var(--mauve); }
    a {
      font-weight: 700; font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--taupe); text-decoration: none; transition: color 220ms;
    }
    a:hover, a:focus-visible { color: var(--mauve); }
  </style>
</head>
<body>
  <h1>4<span>0</span>4</h1>
  <p id="msg">This page doesn't exist.</p>
  <a id="back" href="/">Back to home</a>
  <script src="/assets/lang.js"></script>
  <script>
    const lang = window.swaksLang();
    if (lang === 'fr') {
      document.documentElement.lang = 'fr';
      document.title = 'Page introuvable — swaks.org';
      document.getElementById('msg').textContent = "Cette page n'existe pas.";
      document.getElementById('back').textContent = "Retour à l'accueil";
    }
  </script>
</body>
</html>
